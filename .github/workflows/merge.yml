name: CI - Merge into main
# Workflow to be triggered from staging after the generated models have passed CI.

on:
  repository_dispatch:
  workflow_dispatch:
      inputs:
          version:
              description: 'Google Sheet metadata file version asking for Sync'
              required: false
              type: string

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  createPullRequest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.WORKFLOW_GIT_ACCESS_TOKEN }}
          ref: staging
          fetch-depth: 0

      - name: Create or update staging pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          HEAD_BRANCH="${REPOSITORY_OWNER}:staging"
          BODY="Merge report including last schema models based on updated metadata google sheet version ${VERSION}. Auto-generated after the staging generation workflow completed."
          PR_NUMBER=$(gh api \
            --method GET \
            "repos/${REPOSITORY}/pulls" \
            -f head="$HEAD_BRANCH" \
            -f base=main \
            -f state=open \
            --jq '.[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh api \
              --method POST \
              "repos/${REPOSITORY}/pulls" \
              -f head="$HEAD_BRANCH" \
              -f base=main \
              -f title='Merge from staging' \
              -f body="$BODY" \
              --jq '.number')
          else
            gh api \
              --method PATCH \
              "repos/${REPOSITORY}/pulls/${PR_NUMBER}" \
              -f title='Merge from staging' \
              -f body="$BODY" \
              >/dev/null
          fi
          echo "pull-request-number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Enable Pull Request Automerge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          if gh pr merge --merge --auto "$PR_NUMBER"; then
            echo "Automerge enabled for pull request #${PR_NUMBER}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Pull request #${PR_NUMBER} was created or updated, but automerge could not be enabled. Merge it manually after checks pass." >> "$GITHUB_STEP_SUMMARY"
          fi

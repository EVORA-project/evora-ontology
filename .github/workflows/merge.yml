name: CI - Merge into main
# Workflow to be triggered from staging after the generated models have passed CI.

on:
  repository_dispatch:
  workflow_dispatch:
      inputs:
          version:
              description: 'Google Sheet metadata file version asking for Sync'
              required: false
              type: string

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  createPullRequest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.WORKFLOW_GIT_ACCESS_TOKEN }}
          ref: staging
          fetch-depth: 0

      - name: Create or update staging pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_GIT_ACCESS_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PR_NUMBER=$(gh pr list --head staging --base main --state open --json number --jq '.[0].number // empty')
          BODY="Merge report including last schema models based on updated metadata google sheet version ${VERSION}. Auto-generated after the staging generation workflow completed."
          if [ -z "$PR_NUMBER" ]; then
            gh pr create \
              --head staging \
              --base main \
              --title 'Merge from staging' \
              --body "$BODY" \
              --label report \
              --label 'automated pr' \
              --assignee Angatar
            PR_NUMBER=$(gh pr list --head staging --base main --state open --json number --jq '.[0].number')
          else
            gh pr edit "$PR_NUMBER" \
              --title 'Merge from staging' \
              --body "$BODY"
          fi
          echo "pull-request-number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Enable Pull Request Automerge
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_GIT_ACCESS_TOKEN }}
        run: gh pr merge --merge --auto "${{ steps.pr.outputs.pull-request-number }}"
